name: QA source preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  source-preview:
    if: github.head_ref == 'qa/source-preview' || github.head_ref == 'qa/owner-phase1-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node qa/source-preview/build.cjs
      - run: node --test qa/source-preview/*.test.mjs
      - run: node --test tests/community-phase1.test.cjs tests/community-ui4.test.cjs
      - run: node qa/source-preview/bundle.mjs
