name: Release QA (no deployment)
on:
  pull_request:
  push:
    branches: [dev/modern-functions-20261028, dev/modern-community-candidate-20261028, dev/community-authorization-hardening-20261028]
permissions:
  contents: read
jobs:
  preservation-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '524c984389ec44a83bd612682aadb91ecac6c5fc' }}
        run: node scripts/release/classify-changes.mjs "$BASE_SHA"
      - run: npm run qa:preservation
      - name: Verify exact locked-build source fingerprints without SEO or deployment
        env:
          CONTEXT: production
          SITE_ID: e2667e40-0999-42a3-892b-2b2edff61434
        run: node scripts/release/locked-draft-build.mjs --verify-only
      - run: npm run qa:secrets
      - run: npm run qa:functions
      - run: npm run qa:test
      - run: npm run qa:migration
      - name: Community cards, logo fallback and telephone contract
        run: node --test tests/community/*.test.mjs
      # No deploy token, production secrets, migration or Netlify deploy action.
