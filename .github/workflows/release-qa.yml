name: Release QA (no deployment)
on:
  pull_request:
  push:
    branches: [dev/raffle-atomic-20261028]
permissions:
  contents: read
jobs:
  preservation-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: raffle_atomic_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raffle_atomic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '524c984389ec44a83bd612682aadb91ecac6c5fc' }}
        run: node scripts/release/classify-changes.mjs "$BASE_SHA"
      - run: npm run qa:preservation
      - run: npm run qa:secrets
      - run: npm run qa:functions
      - run: npm run qa:test
      - run: npm run qa:migration
      - run: node --test tests/raffle-unit/*.test.mjs
      - name: Isolated PostgreSQL atomic raffle QA
        env:
          RAFFLE_PG_QA: '1'
        run: node --test tests/raffle/postgres.test.mjs
      # No deploy token, production secrets, migration or Netlify deploy action.
