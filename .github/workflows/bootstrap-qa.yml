name: QA link bootstrap (no deployment)
on:
  push:
    branches: [dev/qa-netlify-link-bootstrap-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test tests/bootstrap.test.cjs
      - run: git status --porcelain
