<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>달타운맵 업주 관리</title><link rel="stylesheet" href="/owner/portal.css"></head><body>
<main><h1>업주 관리</h1><p>이메일 인증과 관리자 승인 후 승인받은 업소를 관리할 수 있습니다.</p>
<form id="auth"><h2>회원가입·로그인</h2><label>이메일<input name="email" type="email" autocomplete="email" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="6" required></label><button name="login">로그인</button><button name="signup">회원가입</button></form>
<section id="portal" hidden><button id="logout">로그아웃</button><button id="refresh">새로고침</button>
<form id="newBusiness"><h2>신규 업소 등록 신청</h2><label>업소명(한글)<input name="name_ko" maxlength="500"></label><label>업소명(영문)<input name="name_en" maxlength="500"></label><p>한글명 또는 영문명 중 하나 이상 입력해 주세요.</p><label>주소<input name="address" maxlength="500" required></label><label>전화<input name="phone" maxlength="500" required></label><label>업종<input name="category_ko" maxlength="500" required></label><p>등록 지역: 텍사스(Texas)</p><button>등록 신청</button></form>
<form id="search"><h2>기존 업소 소유권 신청</h2><label>업소명 검색(한글·영문)<input name="query" maxlength="100" required></label><button>검색</button></form><div id="searchResults"></div>
<section><h2>내 업소</h2><div id="businesses"></div></section><section><h2>신청 현황</h2><p id="counts"></p>
<div class="filters"><label>상태<select id="requestStatus"><option value="">전체</option><option value="pending">대기</option><option value="approved">승인</option><option value="rejected">거절</option><option value="cancelled">취소</option></select></label><label>신청 종류<select id="requestKind"><option value="">전체</option><option value="new">신규 업소</option><option value="claim">소유권</option><option value="core">핵심 정보</option></select></label></div>
<div id="requests"></div><nav aria-label="신청 페이지"><button id="requestPrev">이전 신청</button><span id="requestPage"></span><button id="requestNext">다음 신청</button></nav></section>
<section id="admin" hidden><h2>관리자 승인 대기</h2><p id="pendingCounts"></p><p>위 신청 필터와 페이지의 대기 건을 표시합니다. 승인·거절·권한 회수 시 사유를 기록합니다.</p><div id="queue"></div><h2>업소 권한</h2><div id="memberships"></div><h2>변경 이력</h2><div id="audit"></div><nav aria-label="이력 페이지"><button id="auditPrev">이전 이력</button><span id="auditPage"></span><button id="auditNext">다음 이력</button></nav></section></section>
<p id="status" role="status" aria-live="polite"></p></main>
<script src="/.netlify/functions/config?v=owner-phase1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/owner/portal.js" defer></script></body></html>
