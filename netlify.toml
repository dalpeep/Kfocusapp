[build]
  command = "node scripts/generate-seo.js"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/business/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/category/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[redirects]]
  from = "/business/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/coupon/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/board/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/guide/*"
  to = "/index.html"
  status = 200
