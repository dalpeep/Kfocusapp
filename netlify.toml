[build]
  command = "node scripts/generate-seo.js"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/business/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/category/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# v32 Dallas newsroom: 11:00 UTC = 6:00 AM Central during daylight saving time
[functions."collect-newsroom"]
schedule = "0 11 * * *"
