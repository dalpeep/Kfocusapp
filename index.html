<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function () {
    const cfg = window.KFOCUS_CONFIG || {};
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase?.createClient) {
      console.warn('Supabase client init skipped');
      return;
    }
    window.supabaseClient = window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_ANON_KEY
    );
  })();
</script>

<script>
function requestPush() {
  window.OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.Notifications.requestPermission();

    console.log('permission:', OneSignal.Notifications.permission);
    console.log('optedIn:', OneSignal.User.PushSubscription.optedIn);
  });
}

<div id="iosGuide" style="display:none; position:fixed; bottom:0; left:0; right:0; height:120px; z-index:9999; pointer-events:none;">
  
  <!-- 안내 박스 -->
  <div style="position:absolute; bottom:60px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:10px 14px; border-radius:10px; font-size:13px;">
    ⬇️ 여기 눌러서 "홈 화면에 추가"
  </div>

  <!-- 화살표 -->
  <div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:28px; animation:bounce 1s infinite;">
    ⬆️
  </div>

</div>

<style>
@keyframes bounce {
  0% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-8px); }
  100% { transform: translateX(-50%) translateY(0); }
}
</style>
